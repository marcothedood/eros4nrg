include:
  - project: 'eclipsefdn/it/releng/gitlab-runner-service/gitlab-ci-templates'
    file: 'jobs/buildkit.gitlab-ci.yml'
  - project: 'eclipsefdn/it/releng/gitlab-runner-service/gitlab-ci-templates'
    file: 'pipeline-autodevops.gitlab-ci.yml'

stages:
  - build
  - test

build:data-catalogue:
  stage: build
  extends: .buildkit
  variables:
    CI_REGISTRY_IMAGE: "nemometaos/data-catalogue"
    CONTEXT: "data_catalogue"
    DOCKERFILE: "data_catalogue/Dockerfile"

build:data-pipeline:
  stage: build
  extends: .buildkit
  variables:
    CI_REGISTRY_IMAGE: "nemometaos/data-pipeline"
    CONTEXT: "data_pipeline"
    DOCKERFILE: "data_pipeline/Dockerfile"

build:iot_streams:
  stage: build
  extends: .buildkit
  variables:
    CI_REGISTRY_IMAGE: "nemometaos/iot-streams"
    CONTEXT: "iot_streams"
    DOCKERFILE: "iot_streams/Dockerfile"

build:training-environment:
  stage: build
  extends: .buildkit
  variables:
    CI_REGISTRY_IMAGE: "nemometaos/training-environment"
    CONTEXT: "training_environment"
    DOCKERFILE: "training_environment/Dockerfile"

unit-test:
  stage: test
  script:
    - echo "Running unit tests... This will take about 10 seconds."
    # - docker run $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA /script/to/run/tests
    - sleep 10
    - echo "Tests passed succesfully!"