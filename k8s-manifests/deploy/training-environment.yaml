apiVersion: apps/v1
kind: Deployment
metadata:
  name: eros-training-environment
  labels:
    app: eros
    type: backend
    deployment: eros-training-environment
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: eros-training-environment
  template:
    metadata:
      labels:
        pod: eros-training-environment
        app: eros
        type: backend
        deployment: eros-training-environment
    spec:
      imagePullSecrets:
        - name: nemo-regcred
      containers:
        - name: eros-training-environment
          image: nemometaos/eros-training-environment
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: data
            - name: POSTGRES_HOST
              value: eros-postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eros-postgres-users
                  key: admin.password
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: admin