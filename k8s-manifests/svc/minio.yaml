apiVersion: v1
kind: Service
metadata:
  name: eros-minio
  labels:
    app: eros
    type: backend
    service: eros-minio
spec:
  selector:
    pod: eros-minio
    app: eros
    type: backend
    deployment: eros-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP