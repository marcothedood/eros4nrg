apiVersion: v1
kind: Service
metadata:
  name: eros-iot-stream
  labels:
    app: eros
    type: backend
    service: eros-iot-stream
spec:
  selector:
    pod: eros-iot-stream
    app: eros
    type: backend
    deployment: eros-iot-stream
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP